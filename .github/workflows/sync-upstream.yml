name: Upstream Sync

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
    inputs:
      confirm_breaking_update:
        description: "I have reviewed any compatibility update notice and agree to apply it if present / 我已阅读可能存在的兼容性更新公告，并同意在有此类更新时应用"
        required: true
        default: false
        type: boolean

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check breaking update policy
        id: breaking_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: MarSeventh/CloudFlare-ImgBed
          UPSTREAM_BRANCH: main
          ALLOW_BREAKING_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_breaking_update == true }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh check

      - name: Check sync token
        if: steps.breaking_guard.outputs.blocked != 'true'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Configure the SYNC_TOKEN repository secret with Contents and Workflows write permissions for this repository."
            exit 1
          fi

      - name: Sync upstream changes
        id: sync
        if: steps.breaking_guard.outputs.blocked != 'true'
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: MarSeventh/CloudFlare-ImgBed
          upstream_sync_branch: main
          target_sync_branch: main
          # The token must allow writing repository contents and workflow files.
          # Pushes to main trigger deploy-worker.yml; no extra dispatch is needed.
          target_repo_token: ${{ secrets.SYNC_TOKEN }}
          test_mode: false

      - name: Complete breaking update notices
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh complete

      - name: Sync failure guidance
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ 上游同步未完成 / Upstream synchronization did not complete"
            echo
            echo "请检查 SYNC_TOKEN 是否有效、未过期，并已获授权向当前仓库写入代码和 workflow 文件。"
            echo
            echo "Verify that SYNC_TOKEN is valid, unexpired, and authorized to write contents and workflow files in this repository."
            echo
            echo "Fine-grained PAT 需要当前仓库的 Contents 和 Workflows 读写权限；Classic PAT 需要适当的仓库 scope 和 workflow scope。仅修改 Actions 的 permissions 无法授予 workflow 写入权限。"
            echo
            echo "Fine-grained PATs require Contents and Workflows read/write permissions for this repository; classic PATs require appropriate repository and workflow scopes. Actions permissions alone cannot grant workflow write access."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::上游同步失败。请检查 SYNC_TOKEN 的仓库授权、有效期及 Contents/Workflows 写入权限，并查看上方同步日志。"
          echo "::error::Upstream sync failed. Check SYNC_TOKEN repository access, expiration, and Contents/Workflows write permissions, and review the sync logs above."
          exit 1
